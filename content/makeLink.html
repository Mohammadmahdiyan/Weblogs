
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تبدیل فهرست کتاب به لینک Markdown</title>

<style>
:root {
  color-scheme: light;
  --bg: #f3f4f6;
  --surface: #fff;
  --text: #222;
  --muted: #777;
  --border: #ddd;
  --input-bg: #fff;
  --warning-bg: #fff7ed;
  --warning-border: #fed7aa;
  --item-border: #eee;
  --hover: #f3f4f6;
  --shadow: 0 3px 15px #0001;
  --toast-shadow: 0 5px 25px #0002;
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #111827;
  --surface: #1f2937;
  --text: #f3f4f6;
  --muted: #a1a1aa;
  --border: #4b5563;
  --input-bg: #111827;
  --warning-bg: #422006;
  --warning-border: #92400e;
  --item-border: #374151;
  --hover: #374151;
  --shadow: 0 3px 15px #0004;
  --toast-shadow: 0 5px 25px #0006;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]):not([data-theme="dark"]) {
    color-scheme: dark;
    --bg: #111827;
    --surface: #1f2937;
    --text: #f3f4f6;
    --muted: #a1a1aa;
    --border: #4b5563;
    --input-bg: #111827;
    --warning-bg: #422006;
    --warning-border: #92400e;
    --item-border: #374151;
    --hover: #374151;
    --shadow: 0 3px 15px #0004;
    --toast-shadow: 0 5px 25px #0006;
  }
}

* {
  box-sizing: border-box;
}

body {
  font-family: Tahoma, sans-serif;
  background: var(--bg);
  color: var(--text);
  margin: 0;
  padding: 20px;
  transition: background .2s, color .2s;
}

.container {
  max-width: 850px;
  margin: auto;
  background: var(--surface);
  padding: 22px;
  border-radius: 14px;
  box-shadow: var(--shadow);
}

h2 {
  margin-top: 0;
}

label {
  display: block;
  margin: 18px 0 8px;
  font-weight: bold;
}

input, textarea, select {
  width: 100%;
  padding: 12px;
  border: 1px solid var(--border);
  border-radius: 8px;
  font: inherit;
  background: var(--input-bg);
  color: var(--text);
}

textarea {
  min-height: 230px;
  resize: vertical;
  line-height: 2;
}

button {
  border: 0;
  border-radius: 8px;
  padding: 12px 20px;
  font: inherit;
  cursor: pointer;
  margin-top: 15px;
  background: #2563eb;
  color: white;
}

button:hover {
  opacity: .85;
}

button:disabled {
  opacity: .5;
  cursor: not-allowed;
}

.green {
  background: #15803d;
}

.reset {
  background: #dc2626;
}

.warning {
  background: var(--warning-bg);
  border: 1px solid var(--warning-border);
  padding: 15px;
  border-radius: 8px;
  margin-top: 20px;
}

.hidden {
  display: none !important;
}

small, .hint {
  color: var(--muted);
}

.hint {
  font-size: 12px;
  line-height: 1.8;
  margin-top: 6px;
}

.settings {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
  margin-bottom: 20px;
}

.settings label {
  margin-top: 0;
}

.actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.actions button {
  margin-top: 15px;
}

/* Review Table */

.table-wrapper {
  width: 100%;
  overflow-x: auto;
  margin-top: 15px;
  border: 1px solid var(--border);
  border-radius: 10px;
}

table {
  width: 100%;
  border-collapse: collapse;
  min-width: 350px;
}

th, td {
  padding: 13px;
  border-bottom: 1px solid var(--item-border);
  text-align: right;
  line-height: 1.9;
}

th {
  background: var(--hover);
  font-size: 13px;
}

tr:last-child td {
  border-bottom: none;
}

.review-title {
  cursor: text;
  transition: background .15s;
}

.review-title:hover {
  background: var(--hover);
}

.review-title::after {
  content: " ✎";
  color: var(--muted);
  font-size: 11px;
  opacity: 0;
}

.review-title:hover::after {
  opacity: 1;
}

.review-title[contenteditable="true"] {
  background: var(--input-bg);
  outline: 2px solid #2563eb;
  border-radius: 5px;
}

.review-page {
  cursor: pointer;
  text-align: center;
  min-width: 90px;
  font-weight: bold;
}

.review-page:hover {
  background: var(--hover);
  color: #2563eb;
}

.page-editor {
  width: 90px;
  padding: 7px;
  text-align: center;
  font-weight: bold;
}

.status-ambiguous {
  color: #d97706;
  font-size: 11px;
  display: block;
}

.status-ok {
  color: #16a34a;
  font-size: 11px;
  display: block;
}

/* Toast System */

#toast-container {
  position: fixed;
  top: 20px;
  left: 20px;
  z-index: 99999;
  display: flex;
  flex-direction: column;
  gap: 10px;
  width: min(360px, calc(100vw - 40px));
  pointer-events: none;
}

.toast {
  position: relative;
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 15px;
  background: var(--surface);
  color: var(--text);
  border-radius: 12px;
  box-shadow: var(--toast-shadow);
  overflow: hidden;
  direction: rtl;
  pointer-events: auto;
  animation: toastIn .35s ease forwards;
  border-right: 4px solid #3b82f6;
}

.toast.success { border-color: #16a34a; }
.toast.error { border-color: #dc2626; }
.toast.warning { border-color: #f59e0b; }
.toast.info { border-color: #3b82f6; }

.toast-icon {
  font-size: 21px;
  line-height: 1.3;
}

.toast-content {
  flex: 1;
}

.toast-title {
  font-weight: bold;
  font-size: 14px;
  margin-bottom: 5px;
}

.toast-message {
  font-size: 13px;
  color: var(--muted);
  line-height: 1.8;
  white-space: pre-line;
  overflow-wrap: anywhere;
}

.toast-close {
  border: 0;
  background: transparent;
  color: var(--muted);
  padding: 0;
  margin: 0;
  font-size: 20px;
  cursor: pointer;
}

.toast-progress {
  position: absolute;
  bottom: 0;
  right: 0;
  height: 3px;
  width: 100%;
  background: #3b82f6;
  transform-origin: right;
  animation: toastProgress linear forwards;
}

.toast.success .toast-progress { background: #16a34a; }
.toast.error .toast-progress { background: #dc2626; }
.toast.warning .toast-progress { background: #f59e0b; }

@keyframes toastIn {
  from {
    opacity: 0;
    transform: translateX(-30px);
  }
  to {
    opacity: 1;
    transform: translateX(0);
  }
}

@keyframes toastOut {
  to {
    opacity: 0;
    transform: translateX(-30px);
  }
}

@keyframes toastProgress {
  from { transform: scaleX(1); }
  to { transform: scaleX(0); }
}

@media (max-width: 550px) {
  body {
    padding: 10px;
  }

  .container {
    padding: 16px;
  }

  .settings {
    grid-template-columns: 1fr;
  }

  th, td {
    padding: 10px 8px;
    font-size: 13px;
  }
}
</style>
</head>

<body>

<div id="toast-container"></div>

<div class="container">

  <h2>تبدیل فهرست کتاب به لینک Markdown</h2>

  <div class="settings">
    <div>
      <label for="mode">روش ورود اطلاعات</label>
      <select id="mode" onchange="changeMode()">
        <option value="row">Row - عنوان و شماره صفحه با هم</option>
        <option value="column">Column - ابتدا عنوان‌ها، سپس شماره صفحات</option>
      </select>
    </div>

    <div>
      <label for="theme">قالب ظاهری</label>
      <select id="theme" onchange="changeTheme()">
        <option value="system">تم سیستم</option>
        <option value="light">روشن</option>
        <option value="dark">تاریک</option>
      </select>
    </div>
  </div>

  <label for="slug">نام کتاب (Slug)</label>
  <input id="slug" value="elhad" dir="ltr">

  <div id="rowBox">
    <label for="rowSource">فهرست کامل</label>
    <textarea
      id="rowSource"
      placeholder="عنوان‌ها و شماره صفحات را وارد کن..."
    ></textarea>
    <div class="hint">
      عنوان و شماره صفحه می‌توانند در یک خط یا دو خط متوالی باشند.
    </div>
  </div>

  <div id="columnBox" class="hidden">
    <label for="titles">ستون اول: عنوان مقاله‌ها</label>
    <textarea
      id="titles"
      placeholder="هر عنوان در یک خط..."
    ></textarea>

    <label for="pages">ستون دوم: شماره صفحات</label>
    <textarea
      id="pages"
      placeholder="هر شماره صفحه در یک خط..."
    ></textarea>

    <div class="hint">
      ترتیب شماره صفحات باید دقیقاً با ترتیب عنوان‌ها یکسان باشد.
    </div>
  </div>

  <div class="actions">
    <button onclick="analyze()">بررسی اطلاعات</button>
    <button class="reset" onclick="resetForm()">پاک‌سازی</button>
  </div>

  <div id="review" class="hidden">
    <div class="warning">
      <strong>بررسی موارد مبهم</strong>
      <p>
        روی عنوان دوبار کلیک کن تا ویرایش شود.
        روی شماره صفحه کلیک کن تا تغییرش بدهی.
      </p>
    </div>

    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th>عنوان</th>
            <th style="text-align:center">صفحه</th>
          </tr>
        </thead>
        <tbody id="reviewItems"></tbody>
      </table>
    </div>

    <button onclick="generate()">
      تأیید، ساخت و کپی
    </button>
  </div>

  <div id="output" class="hidden">
    <label for="result">خروجی Markdown</label>
    <textarea id="result" readonly dir="ltr"></textarea>

    <button class="green" onclick="copyResult()">
      کپی خروجی
    </button>
  </div>

</div>

<script>
"use strict";

let entries = [];

const STORAGE_KEYS = {
  mode: "book-linker-mode",
  theme: "book-linker-theme"
};

/* Settings */

function loadSettings() {
  const savedMode = localStorage.getItem(STORAGE_KEYS.mode);
  const savedTheme = localStorage.getItem(STORAGE_KEYS.theme);

  if (savedMode === "row" || savedMode === "column") {
    document.getElementById("mode").value = savedMode;
  }

  if (["system", "light", "dark"].includes(savedTheme)) {
    document.getElementById("theme").value = savedTheme;
  }

  applyTheme();
  updateModeVisibility();
}

function changeMode() {
  localStorage.setItem(
    STORAGE_KEYS.mode,
    document.getElementById("mode").value
  );

  updateModeVisibility();

  entries = [];

  document.getElementById("review").classList.add("hidden");
  document.getElementById("output").classList.add("hidden");
}

function updateModeVisibility() {
  const mode = document.getElementById("mode").value;

  document.getElementById("rowBox")
    .classList.toggle("hidden", mode !== "row");

  document.getElementById("columnBox")
    .classList.toggle("hidden", mode !== "column");
}

function changeTheme() {
  const theme = document.getElementById("theme").value;

  localStorage.setItem(STORAGE_KEYS.theme, theme);

  applyTheme();
}

function applyTheme() {
  const theme = document.getElementById("theme").value;
  const root = document.documentElement;

  if (theme === "system") {
    root.removeAttribute("data-theme");
  } else {
    root.setAttribute("data-theme", theme);
  }
}

/* Digits */

function digits(value) {
  return String(value)
    .replace(/[۰-۹]/g, d => "۰۱۲۳۴۵۶۷۸۹".indexOf(d))
    .replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d));
}

function persianDigits(value) {
  return String(value).replace(/\d/g, d => "۰۱۲۳۴۵۶۷۸۹"[d]);
}

/* Text processing */

function manyDots(value) {
  return /(?:\.{3,}|…{2,})/.test(value);
}

function clean(value) {
  return value.replace(/\s+/g, " ").trim();
}

function add(title, page) {
  title = clean(title);

  if (!title || title === "فهرست") return;

  const normalizedPage = page ? digits(page) : "";

  entries.push({
    title,
    page: normalizedPage,
    ambiguous: manyDots(title) ||
      !/^\d{1,4}$/.test(normalizedPage)
  });
}

/* Toast */

function toast(message, type = "info", duration = 4000) {
  const container = document.getElementById("toast-container");

  const settings = {
    success: { icon: "✓", title: "موفقیت" },
    error: { icon: "✕", title: "خطا" },
    warning: { icon: "⚠", title: "توجه" },
    info: { icon: "ℹ", title: "اطلاعات" }
  };

  const config = settings[type] || settings.info;

  const element = document.createElement("div");
  element.className = `toast ${type}`;

  const icon = document.createElement("div");
  icon.className = "toast-icon";
  icon.textContent = config.icon;

  const content = document.createElement("div");
  content.className = "toast-content";

  const title = document.createElement("div");
  title.className = "toast-title";
  title.textContent = config.title;

  const messageElement = document.createElement("div");
  messageElement.className = "toast-message";
  messageElement.textContent = message;

  const close = document.createElement("button");
  close.className = "toast-close";
  close.textContent = "×";
  close.setAttribute("aria-label", "بستن");

  const progress = document.createElement("div");
  progress.className = "toast-progress";
  progress.style.animationDuration = duration + "ms";

  content.append(title, messageElement);
  element.append(icon, content, close, progress);
  container.appendChild(element);

  let removed = false;

  function remove() {
    if (removed) return;

    removed = true;
    clearTimeout(timer);

    element.style.animation = "toastOut .3s ease forwards";

    setTimeout(() => element.remove(), 300);
  }

  const timer = setTimeout(remove, duration);

  close.addEventListener("click", remove);
}

/* Reset */

function resetForm() {
  document.getElementById("rowSource").value = "";
  document.getElementById("titles").value = "";
  document.getElementById("pages").value = "";
  document.getElementById("result").value = "";

  document.getElementById("review").classList.add("hidden");
  document.getElementById("output").classList.add("hidden");
  document.getElementById("reviewItems").innerHTML = "";

  entries = [];

  toast("تمام ورودی‌ها و خروجی‌ها پاک شدند.", "success");
}

/* Analyze */

function analyze() {
  entries = [];

  document.getElementById("review").classList.add("hidden");
  document.getElementById("output").classList.add("hidden");

  const mode = document.getElementById("mode").value;

  if (mode === "row") {
    parseRow();
  } else {
    if (!parseColumn()) return;
  }

  if (!entries.length) {
    toast("هیچ عنوانی پیدا نشد!", "error");
    return;
  }

  const hasAmbiguous = entries.some(entry => entry.ambiguous);

  if (hasAmbiguous) {
    showReview();
  } else {
    generate();
  }
}

/* Row parser */

function parseRow() {
  const lines = document.getElementById("rowSource")
    .value.split(/\r?\n/);

  let buffer = "";

  for (let line of lines) {
    line = line.trim();

    if (!line || line === "فهرست") continue;

    if (/^[.…\sـ_-]{3,}$/.test(line)) continue;

    const normalized = digits(line);

    if (/^\d{1,4}$/.test(normalized)) {
      if (buffer) {
        add(buffer, normalized);
        buffer = "";
      }
      continue;
    }

    const match = normalized.match(/^(.+?)\s+(\d{1,4})$/);

    if (match) {
      if (buffer) {
        add(buffer, "");
        buffer = "";
      }

      add(match[1], match[2]);
      continue;
    }

    buffer += (buffer ? " " : "") + line;
  }

  if (buffer) {
    add(buffer, "");
  }
}

/* Column parser */

function parseColumn() {
  const titles = document.getElementById("titles").value
    .split(/\r?\n/)
    .map(s => s.trim())
    .filter(Boolean);

  const pages = document.getElementById("pages").value
    .split(/\r?\n/)
    .map(s => digits(s.trim()))
    .filter(Boolean);

  if (titles.length !== pages.length) {
    toast(
      `تعداد عنوان‌ها: ${titles.length}\nتعداد صفحات: ${pages.length}`,
      "error",
      6000
    );

    return false;
  }

  titles.forEach((title, index) => {
    add(title, pages[index]);
  });

  return true;
}

/* Review table */

function showReview() {
  const tbody = document.getElementById("reviewItems");

  tbody.innerHTML = "";

  entries.forEach((entry, index) => {
    const tr = document.createElement("tr");

    /* Title cell */

    const titleCell = document.createElement("td");
    titleCell.className = "review-title";
    titleCell.textContent = entry.title;
    titleCell.title = "برای ویرایش دوبار کلیک کن";

    titleCell.addEventListener("dblclick", () => {
      editTitle(titleCell, index);
    });

    /* Page cell */

    const pageCell = document.createElement("td");
    pageCell.className = "review-page";
    pageCell.title = "برای تغییر شماره صفحه کلیک کن";
    pageCell.textContent = entry.page
      ? persianDigits(entry.page)
      : "وارد نشده";

    pageCell.addEventListener("click", () => {
      editPage(pageCell, index);
    });

    tr.append(titleCell, pageCell);
    tbody.appendChild(tr);
  });

  document.getElementById("review").classList.remove("hidden");
  document.getElementById("output").classList.add("hidden");
}

/* Edit title with double click */

function editTitle(cell, index) {
  if (cell.getAttribute("contenteditable") === "true") return;

  cell.contentEditable = "true";
  cell.focus();

  function save() {
    cell.contentEditable = "false";

    const newTitle = clean(cell.textContent);

    if (!newTitle) {
      cell.textContent = entries[index].title;
      toast("عنوان نمی‌تواند خالی باشد.", "warning");
      return;
    }

    entries[index].title = newTitle;

    entries[index].ambiguous =
      manyDots(newTitle) ||
      !/^\d{1,4}$/.test(entries[index].page);
  }

  cell.addEventListener("blur", save, { once: true });

  cell.addEventListener("keydown", event => {
    if (event.key === "Enter") {
      event.preventDefault();
      cell.blur();
    }

    if (event.key === "Escape") {
      cell.textContent = entries[index].title;
      cell.blur();
    }
  }, { once: true });
}

/* Edit page with click */

function editPage(cell, index) {
  if (cell.querySelector("input")) return;

  const input = document.createElement("input");

  input.type = "number";
  input.min = "1";
  input.step = "1";
  input.className = "page-editor";
  input.value = entries[index].page;
  input.placeholder = "صفحه";

  cell.textContent = "";
  cell.appendChild(input);

  input.focus();
  input.select();

  function save() {
    const value = digits(input.value.trim());

    if (value && /^\d{1,4}$/.test(value) && Number(value) > 0) {
      entries[index].page = value;
    }

    entries[index].ambiguous =
      manyDots(entries[index].title) ||
      !/^\d{1,4}$/.test(entries[index].page);

    cell.textContent = entries[index].page
      ? persianDigits(entries[index].page)
      : "وارد نشده";
  }

  input.addEventListener("blur", save, { once: true });

  input.addEventListener("keydown", event => {
    if (event.key === "Enter") {
      input.blur();
    }

    if (event.key === "Escape") {
      input.value = entries[index].page;
      input.blur();
    }
  });
}

/* Markdown escaping */

function escapeMarkdownTitle(value) {
  return value
    .replace(/\\/g, "\\\\")
    .replace(/\|/g, "\\|")
    .replace(/\]/g, "\\]");
}

/* Generate Markdown table */

async function generate() {
  const slug = document.getElementById("slug").value.trim();

  if (!slug) {
    toast("نام کتاب را وارد کن!", "warning");
    return;
  }

  /* Validate every page */

  for (let i = 0; i < entries.length; i++) {
    const page = digits(entries[i].page.trim());

    if (!page || !/^\d{1,4}$/.test(page) || Number(page) < 1) {
      toast(
        `شماره صفحه عنوان «${entries[i].title}» معتبر نیست.`,
        "warning"
      );

      return;
    }

    entries[i].page = page;
  }

  /* Build Markdown */

  const rows = [
    "| عنوان | صفحه |",
    "| --- | --- |"
  ];

  entries.forEach(entry => {
    const title = escapeMarkdownTitle(entry.title);
    const page = entry.page;

    rows.push(
      `| [${title}](/books/${slug}/${page}) | ${persianDigits(page)} |`
    );
  });

  const output = rows.join("\n");

  document.getElementById("result").value = output;
  document.getElementById("output").classList.remove("hidden");
  document.getElementById("review").classList.add("hidden");

  document.getElementById("output").scrollIntoView({
    behavior: "smooth"
  });

  /* Copy automatically */

  const copied = await copyText(output);

  if (copied) {
    toast("جدول ساخته و با موفقیت کپی شد.", "success");
  } else {
    toast("جدول ساخته شد؛ اما کپی خودکار انجام نشد.", "warning");
  }
}

/* Clipboard */

async function copyText(text) {
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
      return true;
    }
  } catch (error) {
    // Use fallback below.
  }

  const temporary = document.createElement("textarea");

  temporary.value = text;
  temporary.style.position = "fixed";
  temporary.style.opacity = "0";
  temporary.style.left = "-9999px";

  document.body.appendChild(temporary);

  temporary.focus();
  temporary.select();

  let copied = false;

  try {
    copied = document.execCommand("copy");
  } catch (error) {
    copied = false;
  }

  temporary.remove();

  return copied;
}

async function copyResult() {
  const text = document.getElementById("result").value;

  if (!text) {
    toast("ابتدا خروجی را تولید کن.", "warning");
    return;
  }

  const copied = await copyText(text);

  toast(
    copied ? "خروجی با موفقیت کپی شد." : "کپی خودکار انجام نشد.",
    copied ? "success" : "error"
  );
}

/* Initialize */

loadSettings();

</script>
