name: Deploy Weblogs

on:
  push:
    branches:
      - main
  workflow_dispatch:
  # Every day just after midnight in Iran (00:05 Asia/Tehran = 20:35 UTC): delete yesterday's story and
  # rebuild, so the story ring always shows today's story (or today's random article section).
  schedule:
    - cron: '35 20 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # --ignore-scripts: skip dependency install scripts. The only one this site does not need online is
      # ffmpeg-static, which downloads a ~30 MB binary from GitHub releases and failed the whole deploy with an HTTP 504
      # (it is only used on a developer's computer to fix video audio; the build falls back gracefully without it).
      # The other install script (esbuild) is only an optimization: its binary comes from an optional package.
      # Up to 3 attempts, so a short npm registry hiccup does not fail the deploy either.
      - name: Install dependencies
        run: |
          npm ci --ignore-scripts \
            || (echo "npm ci failed, retrying in 15s" && sleep 15 && npm ci --ignore-scripts) \
            || (echo "npm ci failed again, last try in 45s" && sleep 45 && npm ci --ignore-scripts)

      - name: Delete yesterday's story
        run: |
          npm run cleanStory
          if [ -n "$(git status --porcelain -- story content/media/story content/books/story content/story-state.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A -- story content/media/story content/books/story content/story-state.json
            git commit -m "story: remove expired story"
            git push origin HEAD:main || echo "::warning::Could not push the story cleanup (main moved); the build below still ignores the expired story."
          fi

      - name: Build website
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4