    <g fill="var(--no-image-cloud, #fff)" opacity=".62">
      <path d="M75 112c0-9 7-16 16-16 3-11 13-18 25-18 13 0 24 9 26 21 9 1 16 8 16 17H75z"/>
      <path d="M334 91c0-7 6-13 13-13 2-9 10-15 20-15 11 0 19 7 21 17 7 1 12 6 12 13h-66z" opacity=".72"/>
    </g>
    <g fill="none" stroke="var(--no-image-cloud, #fff)" stroke-linecap="round" opacity=".54">
