<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 640 360"
     width="640"
     height="360"
     role="img"
     aria-labelledby="no-image-title">
  <title id="no-image-title">تصویر پیش‌فرض مقاله</title>

  <defs>
    <linearGradient id="sky-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="var(--no-image-sky, #e8f0ea)"/>
      <stop offset="100%" stop-color="var(--no-image-bg, #f5f1e8)"/>
    </linearGradient>
    <linearGradient id="sun-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="var(--no-image-sun, #e5b96c)"/>
      <stop offset="100%" stop-color="var(--no-image-sun, #e5b96c)" stop-opacity=".55"/>
    </linearGradient>
    <linearGradient id="mountain-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="var(--no-image-mountain, #789482)"/>
      <stop offset="100%" stop-color="var(--no-image-foreground, #587866)"/>
    </linearGradient>
    <linearGradient id="path-gradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--no-image-snow, #f5f1e8)" stop-opacity=".78"/>
      <stop offset="100%" stop-color="var(--no-image-snow, #f5f1e8)" stop-opacity=".12"/>
    </linearGradient>
    <clipPath id="image-frame">
      <rect width="640" height="360"/>
    </clipPath>
  </defs>

  <g clip-path="url(#image-frame)">
    <rect width="640" height="360" fill="url(#sky-gradient)"/>

    <circle cx="486" cy="104" r="71" fill="url(#sun-gradient)" opacity=".16"/>
    <circle cx="486" cy="104" r="48" fill="url(#sun-gradient)" opacity=".94"/>
    <circle cx="486" cy="104" r="61" fill="none"
